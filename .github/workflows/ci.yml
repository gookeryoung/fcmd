name: CI

on:
  push:
    branches: [main, develop]
    # Skip CI for changes that cannot affect lint/test results (e.g. docs)
    paths: &ci_paths
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pyrefly.toml'
      - 'pytest.ini'
      - 'ruff.toml'
      - '.coveragerc'
      - '.pre-commit-config.yaml'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths: *ci_paths
  # Allow manual full runs (bypasses the paths filter)
  workflow_dispatch:

# Least privilege: CI only needs read access to the repository
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --extra lint

      - name: Cache ruff
        uses: actions/cache@v6
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-${{ hashFiles('pyproject.toml','ruff.toml') }}

      - name: Ruff check + format
        run: |
          uv run ruff check --silent src tests --cache-dir .ruff_cache
          uv run ruff format --check src tests

      - name: Cache pyrefly
        uses: actions/cache@v6
        with:
          path: .pyrefly_cache
          key: pyrefly-${{ runner.os }}-${{ hashFiles('pyrefly.toml','pyproject.toml','src/**/*.py') }}
          restore-keys: |
            pyrefly-${{ runner.os }}-

      - name: Pyrefly check (parallel)
        run: uv run pyrefly check -j 0

  test:
    name: Test (Python 3.13 & 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # PySide6 的 Linux wheel 依赖系统 GL/EGL 与输入库；runner 默认没有 libEGL，
      # 导入 PySide6 会直接 ImportError（即使只跑离屏 Qt 测试）。
      # 缓存 .deb 到工作区目录而非 /var/cache/apt/archives：后者里的 lock（root 所有）
      # 与 partial/（_apt 所有）对 runner 用户无读权限，post 阶段 tar 会 Permission
      # denied 退出码 2，导致缓存从未保存成功。
      - name: Cache Qt runtime .deb packages
        uses: actions/cache@v6
        with:
          path: .apt-cache
          key: apt-qt-runtime-${{ runner.os }}-v2
          restore-keys: |
            apt-qt-runtime-${{ runner.os }}-

      - name: Install Qt runtime libraries
        run: |
          # 命中缓存时把 .deb 放回 apt 缓存目录，apt 直接安装不再重复下载
          if compgen -G ".apt-cache/*.deb" > /dev/null; then
            sudo cp -a .apt-cache/*.deb /var/cache/apt/archives/
          fi
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
          # 只拷 .deb（lock/partial 对 runner 用户无权限），并归还所有权供 actions/cache 打包
          mkdir -p .apt-cache
          sudo cp -a /var/cache/apt/archives/*.deb .apt-cache/
          sudo chown -R "$(id -u):$(id -g)" .apt-cache

      - name: Sync dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --extra test --extra agent --python ${{ matrix.python-version }}

      - name: Run tests
        env:
          # 所有 Qt 测试统一走离屏平台，runner 没有 X/Wayland 显示
          QT_QPA_PLATFORM: offscreen
        # xdist 并行：本机 8 核约 15–20s，GitHub 2 核 runner 也能把 8k+ 测试
        # 压到数分钟内，避免串行跑满 15m 超时；loadfile 已在 pytest.ini addopts。
        run: uv run pytest -n auto -m "not slow" --cov=fcmd --cov-fail-under=95 --cov-report=term-missing
