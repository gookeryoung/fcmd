name: CI

on:
  push:
    branches: [main, develop]
    # Skip CI for changes that cannot affect lint/test results (e.g. docs)
    paths: &ci_paths
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pyrefly.toml'
      - 'pytest.ini'
      - 'ruff.toml'
      - '.coveragerc'
      - '.pre-commit-config.yaml'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths: *ci_paths
  # Allow manual full runs (bypasses the paths filter)
  workflow_dispatch:

# Least privilege: CI only needs read access to the repository
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # lint 的依赖集合（lint extra）与测试 job（test + agent extra）不同，
          # 共用同一个缓存 key 会互相顶掉（GitHub 缓存按 key 不可覆盖，先写者生效），
          # 每次都要补下对方缺的包，因此分开存。
          cache-suffix: lint

      - name: Sync dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --extra lint

      - name: Cache ruff
        uses: actions/cache@v6
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-${{ hashFiles('pyproject.toml','ruff.toml') }}

      - name: Ruff check + format
        run: |
          uv run ruff check --silent src tests --cache-dir .ruff_cache
          uv run ruff format --check src tests

      - name: Cache pyrefly
        uses: actions/cache@v6
        with:
          path: .pyrefly_cache
          key: pyrefly-${{ runner.os }}-${{ hashFiles('pyrefly.toml','pyproject.toml','src/**/*.py') }}
          restore-keys: |
            pyrefly-${{ runner.os }}-

      - name: Pyrefly check (parallel)
        run: uv run pyrefly check -j 0

  test:
    name: Test (Python 3.10 / 3.13 / 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.10 恢复 xdist 并行：此前卡死根因是冒烟测试残留真实网络线程，已改为
          # search_models 打桩。保留 faulthandler 看门狗诊断（独立 C 线程计时）。
          - python-version: "3.10"
            pytest_args: "-n auto -o faulthandler_timeout=120"
            # 覆盖率门禁由 3.13 / 3.14 保证；3.10 只跑测试，省掉 coverage 追踪开销。
            cov_args: ""
          - python-version: "3.13"
            pytest_args: "-n auto"
            # coverage 7.16 在 3.13 只能走 C tracer（sys.monitoring 不支持分支测量，
            # 设 COVERAGE_CORE=sysmon 会告警回退）。实测占测试时间 ~43%（本地 n2：
            # 53s → 76s），而 3.14 走 sysmon 只占 ~12%。门禁由 3.14 保证，3.13 只跑测试。
            cov_args: ""
          - python-version: "3.14"
            pytest_args: "-n auto"
            cov_args: "--cov=fcmd --cov-fail-under=95 --cov-report=term-missing"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # 按 Python 版本分键：3.10 装 PySide2（157MB wheel），3.13 / 3.14 装
          # PySide6，依赖集合互不相同。共用 key 时只有先写入的格子能命中，
          # 其余格子仍要补下自己的 Qt 绑定（实测单次 6~7 分钟）。
          cache-suffix: py${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # PySide2 / PySide6 的 Linux wheel 都依赖系统 GL/EGL 与输入库；runner 默认
      # 没有 libEGL，导入 Qt 绑定会直接 ImportError（即使只跑离屏 Qt 测试）。
      # 缓存 .deb 到工作区目录而非 /var/cache/apt/archives：后者里的 lock（root 所有）
      # 与 partial/（_apt 所有）对 runner 用户无读权限，post 阶段 tar 会 Permission
      # denied 退出码 2，导致缓存从未保存成功。
      - name: Cache Qt runtime .deb packages
        uses: actions/cache@v6
        with:
          path: .apt-cache
          key: apt-qt-runtime-${{ runner.os }}-v2
          restore-keys: |
            apt-qt-runtime-${{ runner.os }}-

      - name: Install Qt runtime libraries
        run: |
          # runner 镜像大多已预装这些库，先只挑出真正缺失的再装（实测 6 个里通常
          # 只缺 libegl1 / libxkbcommon-x11-0 及其依赖，全量 install 的 dpkg 空转会白跑）。
          packages=""
          for pkg in libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1; do
            dpkg -s "$pkg" > /dev/null 2>&1 || packages="$packages $pkg"
          done
          if [ -z "$packages" ]; then
            echo "Qt runtime libraries already present, skip apt"
            exit 0
          fi
          echo "installing:$packages"
          # 命中缓存时把 .deb 放回 apt 缓存目录，安装时不必联网；只有失败
          # （索引过期 / 缓存没覆盖某个包）才更新索引重试。
          if compgen -G ".apt-cache/*.deb" > /dev/null; then
            sudo cp -a .apt-cache/*.deb /var/cache/apt/archives/
          fi
          if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $packages; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $packages
          fi
          # 只拷 .deb（lock/partial 对 runner 用户无权限），并归还所有权供 actions/cache 打包
          mkdir -p .apt-cache
          sudo cp -a /var/cache/apt/archives/*.deb .apt-cache/
          sudo chown -R "$(id -u):$(id -g)" .apt-cache

      - name: Sync dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --extra test --extra agent --python ${{ matrix.python-version }}

      - name: Run tests
        env:
          # 所有 Qt 测试统一走离屏平台，runner 没有 X/Wayland 显示
          QT_QPA_PLATFORM: offscreen
        # xdist 并行（worksteal 动态派发，见 pytest.ini）；打印最慢 25 个用例，
        # 便于后续定位还能压缩的测试。
        run: uv run pytest ${{ matrix.pytest_args }} -m "not slow" --durations=25 ${{ matrix.cov_args }}
