name: CI

on:
  push:
    branches: [main, develop]
    # Skip CI for changes that cannot affect lint/test results (e.g. docs)
    paths: &ci_paths
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pyrefly.toml'
      - 'pytest.ini'
      - 'ruff.toml'
      - '.coveragerc'
      - '.pre-commit-config.yaml'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths: *ci_paths
  # Allow manual full runs (bypasses the paths filter)
  workflow_dispatch:

# Least privilege: CI only needs read access to the repository
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --extra lint

      - name: Cache ruff
        uses: actions/cache@v6
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-${{ hashFiles('pyproject.toml','ruff.toml') }}

      - name: Ruff check + format
        run: |
          uv run ruff check --silent src tests --cache-dir .ruff_cache
          uv run ruff format --check src tests

      - name: Cache pyrefly
        uses: actions/cache@v6
        with:
          path: .pyrefly_cache
          key: pyrefly-${{ runner.os }}-${{ hashFiles('pyrefly.toml','pyproject.toml','src/**/*.py') }}
          restore-keys: |
            pyrefly-${{ runner.os }}-

      - name: Pyrefly check (parallel)
        run: uv run pyrefly check -j 0

  test:
    name: Test (Python 3.13 & 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      

      - name: Sync dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}

      - name: Run tests
        
        run: uv run pytest -m "not slow" --cov=fcmd --cov-fail-under=95 --cov-report=term-missing
