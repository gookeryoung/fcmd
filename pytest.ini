[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    e2e: marks end-to-end tests (subprocess, filesystem side effects)
    e2e_smoke: marks e2e smoke tests (fast, verifies console_script entry)
testpaths = tests
filterwarnings =
    ignore:Benchmarks are automatically disabled because xdist plugin is active
