[pytest]
markers =
    slow: 慢测试（子进程 / 真实 IO / 超时等待）；make test 默认跳过，make test-all / make cov 全跑
    e2e: end-to-end CLI tests
    e2e_smoke: fast end-to-end smoke tests
testpaths = tests
timeout = 30
addopts = --dist loadfile
filterwarnings =
    ignore:Benchmarks are automatically disabled because xdist plugin is active