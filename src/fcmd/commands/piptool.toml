# 内置 DSL 命令：piptool（与 Python 模块 fcmd/cli/dev/piptool.py 逐子命令合并）。
#
# 仅迁入纯 exec 型子命令 i/up；含逻辑的 u/r/f（通配符展开、受保护包过滤、
# freeze 落盘）保留在模块内。i 的 packages 演示 list 参数独占占位符用法。

[commands.piptool.i]
help = "安装包"
cmd = ["pip", "install", "{packages}"]
[commands.piptool.i.args.packages]
type = "list"
help = "包名列表"

[commands.piptool.up]
help = "升级 pip"
cmd = ["python", "-m", "pip", "install", "--upgrade", "pip"]
