# 内置 DSL 命令：idtool（多子命令形态，内建动作原语）。
#
# 原模块 fcmd/cli/crypto/idtool.py 已迁入 fcmd/dsl/actions/genid.py：
# uuid/timestamp/random 三子命令均为纯 Python（uuid/secrets/datetime），
# 无子进程调用。动作签名即 CLI 参数 schema；非法参数（UUID 版本/时间戳
# 格式/random 长度）捕获后打印错误提示，不视为失败。

[commands.idtool.uuid]
help = "生成 UUID"
action = "idtool_uuid"

[commands.idtool.timestamp]
help = "生成时间戳"
action = "idtool_timestamp"

[commands.idtool.random]
help = "生成随机字符串"
action = "idtool_random"
