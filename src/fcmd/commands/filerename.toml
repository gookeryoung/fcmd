# 内置 DSL 命令：filerename（多子命令形态，内建动作原语）。
#
# 原模块 fcmd/cli/fileops/filerename.py 已迁入 fcmd/dsl/actions.py 注册表：
# 逐文件过程反馈（预览/重命名回显/目标已存在跳过/缺失提示）由动作内 print
# 输出；指令级错误（无效正则/无效模式）→ 任务失败汇总 + 退出码 1（行为
# 变化：原版打印后退出码 0）。

[commands.filerename.replace]
help = "正则替换文件名主干"
action = "filerename_replace"

[commands.filerename.insert]
help = "在文件名指定位置插入文本"
action = "filerename_insert"

[commands.filerename.case]
help = "转换文件名大小写"
action = "filerename_case"
