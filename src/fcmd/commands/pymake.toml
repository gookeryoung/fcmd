# 内置 DSL 命令：pymake（多子命令形态，纯 exec 型子命令）。
#
# 与 Python 模块 fcmd/cli/dev/pymake.py 合并注册：模块仅保留含逻辑的
# push（callable cmd 遍历 git remote）与 main 入口。DSL 字段速查见
# README「命令定义 DSL」与 fcmd/dsl/decl.py（校验权威）。

[commands.pymake.b]
help = "构建分发包 (uv build)"
cmd = ["uv", "build"]
[commands.pymake.b.args.cwd]
type = "path"
default = "."
help = "工作目录"

[commands.pymake.bump]
help = "升级 patch 版本号 (bump-my-version bump patch)"
cmd = ["uvx", "bump-my-version", "bump", "patch", "--tag"]
[commands.pymake.bump.args.cwd]
type = "path"
default = "."
help = "工作目录"

[commands.pymake.bumpma]
help = "升级主版本号 (bump-my-version bump major)"
cmd = ["uvx", "bump-my-version", "bump", "major", "--tag"]
[commands.pymake.bumpma.args.cwd]
type = "path"
default = "."
help = "工作目录"

[commands.pymake.bumpmi]
help = "升级次版本号 (bump-my-version bump minor)"
cmd = ["uvx", "bump-my-version", "bump", "minor", "--tag"]
[commands.pymake.bumpmi.args.cwd]
type = "path"
default = "."
help = "工作目录"

[commands.pymake.c]
help = "清理构建产物与缓存目录"
cmd = ["gitt", "c"]

[commands.pymake.doc]
help = "构建 Sphinx 文档"
cmd = ["sphinx-build", "-b", "html", "docs", "docs/_build/html"]
[commands.pymake.doc.args.cwd]
type = "path"
default = "."
help = "工作目录"

[commands.pymake.lint]
help = "代码检查与自动修复 (ruff check --fix)"
cmd = ["ruff", "check", "--fix", "."]
[commands.pymake.lint.args.cwd]
type = "path"
default = "."
help = "工作目录"

[commands.pymake.fmt]
help = "代码格式化 (ruff format)"
cmd = ["ruff", "format", "."]
hidden = true
[commands.pymake.fmt.args.cwd]
type = "path"
default = "."
help = "工作目录"

[commands.pymake.fmtc]
help = "格式化检查 (ruff format --check，不修改文件)"
cmd = ["ruff", "format", "--check", "."]
hidden = true
[commands.pymake.fmtc.args.cwd]
type = "path"
default = "."
help = "工作目录"

[commands.pymake.pyrefly_check]
help = "pyrefly 类型检查"
cmd = ["pyrefly", "check"]
hidden = true
[commands.pymake.pyrefly_check.args.cwd]
type = "path"
default = "."
help = "工作目录"

# 聚合命令：无 cmd，按 needs 编排（thread 策略并行）
[commands.pymake.chk]
help = "类型检查 (清理 + pyrefly + lint + test_fast)"
needs = ["pyrefly_check", "lint", "fmt", "tf"]
strategy = "thread"

[commands.pymake.tc]
help = "类型检查 (清理 + pyrefly + lint)"
needs = ["pyrefly_check", "lint", "fmt"]
strategy = "thread"

[commands.pymake.t]
help = "运行测试 (pytest)"
cmd = ["pytest", "-m", "not slow", "--color=yes", "--durations=10"]
[commands.pymake.t.args.cwd]
type = "path"
default = "."
help = "工作目录"

[commands.pymake.tn]
help = "运行测试 (pytest)"
cmd = ["pytest", "-n", "8", "-m", "not slow", "--color=yes", "--durations=10"]
[commands.pymake.tn.args.cwd]
type = "path"
default = "."
help = "工作目录"

[commands.pymake.cov]
help = "测试并生成覆盖率"
cmd = [
    "pytest",
    "-m",
    "not slow",
    "-n",
    "auto",
    "--cov=fcmd",
    "--cov-fail-under=95",
    "--color=yes",
    "--durations=10",
]
[commands.pymake.cov.args.cwd]
type = "path"
default = "."
help = "工作目录"

[commands.pymake.tf]
help = "快速测试 (遇到失败立即停止)"
cmd = ["pytest", "-m", "not slow", "--color=yes", "-x", "--durations=10"]
[commands.pymake.tf.args.cwd]
type = "path"
default = "."
help = "工作目录"

[commands.pymake.ts]
help = "测试 slow 标记的测试 (pytest -m slow)"
cmd = ["pytest", "-m", "slow", "-n", "8", "--color=yes", "--durations=10"]
[commands.pymake.ts.args.cwd]
type = "path"
default = "."
help = "工作目录"

[commands.pymake.tox]
help = "多版本测试 (tox -p auto)"
cmd = ["uvx", "tox", "-p", "auto"]
[commands.pymake.tox.args.cwd]
type = "path"
default = "."
help = "工作目录"

[commands.pymake.sync]
help = "同步开发依赖 (uv sync --extra dev)"
cmd = ["uv", "sync", "--extra", "dev"]
[commands.pymake.sync.args.cwd]
type = "path"
default = "."
help = "工作目录"

[commands.pymake.upload]
help = "使用 twine 发布到 PyPI"
cmd = ["uvx", "twine", "upload", "--disable-progress-bar", "dist/*"]
hidden = true
[commands.pymake.upload.args.cwd]
type = "path"
default = "."
help = "工作目录"
