# 内置 DSL 命令：xmltool（多子命令形态，内建动作原语）。
#
# 原模块 fcmd/cli/data/xmltool.py 已迁入 fcmd/dsl/actions/data.py：
# pretty/minify/extract/validate 四子命令均为纯 Python
# （xml.etree.ElementTree），无子进程调用。动作签名即 CLI 参数 schema；
# XML 解析失败 / XPath 语法错误捕获后打印错误提示，不视为失败（退出码 0）。

[commands.xmltool.pretty]
help = "格式化打印 XML"
action = "xmltool_pretty"

[commands.xmltool.minify]
help = "压缩 XML 为单行"
action = "xmltool_minify"

[commands.xmltool.extract]
help = "按 XPath 提取值"
action = "xmltool_extract"

[commands.xmltool.validate]
help = "校验 XML 良构性"
action = "xmltool_validate"
