# sshcopyid - SSH 公钥部署工具（DSL 声明）
#
# 设计要点：
# 1) 远端脚本统一走 stdin 流（cat >> authorized_keys），公钥文件重定向到
#    ssh stdin，**不把公钥内容插值进远端 bash 命令字符串**——避免
#    echo '{key}' 的引号断裂、awk 判重复杂度等问题，一次一条、幂等追加。
# 2) 平台分支：
#    - Linux：sshpass -e 从 SSHPASS 环境变量读密码，**密码不进命令行 argv**
#      （安全）；shell 重定向把公钥文件送入 ssh stdin。
#    - Windows：synth 层自动检测最优 SSH 客户端，**plink 优先 → OpenSSH 次之**
#      ：
#      · plink（PuTTY 命令行工具）：很多 Windows 用户 PATH 中预装。
#        synth 层检测到后，把 OpenSSH 命令模板重写为 plink 格式——
#        追加 ``-pw {password} -batch``、``-p`` → ``-P``、去掉
#        ``-o`` 选项。password 参数**正常生效**，完全自动部署。
#      · OpenSSH（Windows 10/11 自带）：不支持自动传密码。synth 层
#        只替换裸 ``ssh`` 为完整路径（避免 PATH 中 plink 劫持），
#        ``tty=true`` 让 SSH 密码提示透传到终端。password 参数
#        **无法自动注入**，用户需交互输入。
#      · 都没找到：回退裸 ``ssh``（可能被 PATH 中 plink 劫持，属
#        用户环境问题）。
# 3) synth 层 plink/OpenSSH 检测逻辑：``resolve_windows_ssh_client()``
#    协调 ``resolve_windows_plink()``（where plink + plink -V 含 PuTTY）
#    与 ``resolve_windows_openssh()``（System32\\OpenSSH\\ssh.exe +
#    ssh -V 含 OpenSSH），lru_cache 缓存，进程内只做一次检测。

[commands.sshcopyid]
help = "部署 SSH 公钥到远程服务器"
description = "SSH 公钥部署工具（Linux: sshpass 自动密码，Windows: plink 优先自动密码 / OpenSSH 需交互）"
when = { path = "{keypath}", expect = "exists" }

# ---- Linux / macOS 分支 ----
# shell=True 走 bash/sh，SSHPASS 由 env 注入 subprocess 环境变量
unix.cmd = "sshpass -e ssh -p {port} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout={timeout} {username}@{hostname} \"mkdir -p ~/.ssh && chmod 700 ~/.ssh && cat >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys\" < \"{keypath}\""
unix.env = { SSHPASS = "{password}" }

# ---- Windows 分支 ----
# shell=True 走 cmd.exe（Windows subprocess 默认），stdin 重定向 < 文件可用
# 无 sshpass，SSH 需要交互式密码输入 → tty=true 透传终端
win.cmd = "ssh -p {port} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout={timeout} {username}@{hostname} \"mkdir -p ~/.ssh && chmod 700 ~/.ssh && cat >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys\" < \"{keypath}\""
win.tty = true

message = "SSH 密钥已部署到 {username}@{hostname}:{port}"
fail_message = "部署失败，可手动执行: ssh-copy-id -p {port} {username}@{hostname}"

[commands.sshcopyid.args.hostname]
help = "远程服务器主机名或 IP 地址"

[commands.sshcopyid.args.username]
help = "远程服务器用户名"

[commands.sshcopyid.args.password]
help = "远程服务器密码（Linux 经 SSHPASS 环境变量传递，不进命令行；Windows 检测到 plink 时经 -pw 命令行参数传递，OpenSSH 分支无法自动注入需交互输入）"

[commands.sshcopyid.args.port]
type = "int"
help = "SSH 端口（默认 22）"
default = 22

[commands.sshcopyid.args.keypath]
type = "path"
help = "公钥文件路径（默认 ~/.ssh/id_rsa.pub，插入命令前展开为绝对路径）"
default = "~/.ssh/id_rsa.pub"

[commands.sshcopyid.args.timeout]
type = "int"
help = "SSH 连接超时秒数（默认 30）"
default = 30
