# 内置 DSL 命令：textdiff（多子命令形态，内建动作原语）。
#
# 原模块 fcmd/cli/text/textdiff.py 已迁入 fcmd/dsl/actions/text.py：
# file/dir 二子命令均为纯 Python（difflib/filecmp/pathlib），无子进程
# 调用。动作签名即 CLI 参数 schema；二进制文件/文件不存在/目录不存在
# 捕获后打印错误提示，不视为失败（退出码 0）。

[commands.textdiff.file]
help = "比较两个文本文件"
action = "textdiff_file"

[commands.textdiff.dir]
help = "比较两个目录"
action = "textdiff_dir"
