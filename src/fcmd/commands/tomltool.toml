# 内置 DSL 命令：tomltool（多子命令形态，内建动作原语）。
#
# 原模块 fcmd/cli/data/tomltool.py 已迁入 fcmd/dsl/actions/data.py：
# get/keys/format/validate 四子命令均为纯 Python（tomllib/tomli + json），
# 无子进程调用。动作签名即 CLI 参数 schema；点路径非法 / TOML 语法错误
# 捕获后打印错误提示，不视为失败（退出码 0）。

[commands.tomltool.get]
help = "按点路径取值"
action = "tomltool_get"

[commands.tomltool.keys]
help = "列出顶层键"
action = "tomltool_keys"

[commands.tomltool.format]
help = "转为 JSON 格式化输出"
action = "tomltool_format"

[commands.tomltool.validate]
help = "语法校验"
action = "tomltool_validate"
