# 内置 DSL 命令：txttool（多子命令形态，内建动作原语）。
#
# 原模块 fcmd/cli/text/txttool.py 已迁入 fcmd/dsl/actions/text.py：
# count/sort/unique/case 四子命令均为纯 Python（str/pathlib），无子
# 进程调用。动作签名即 CLI 参数 schema；非法大小写转换模式捕获后
# 打印错误提示，不视为失败（退出码 0）。

[commands.txttool.count]
help = "统计行/词/字符数"
action = "txttool_count"

[commands.txttool.sort]
help = "排序文本行"
action = "txttool_sort"

[commands.txttool.unique]
help = "去重文本行"
action = "txttool_unique"

[commands.txttool.case]
help = "大小写转换"
action = "txttool_case"
