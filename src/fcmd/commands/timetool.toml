# 内置 DSL 命令：timetool（多子命令形态，内建动作原语）。
#
# 原模块 fcmd/cli/calc/timetool.py 已迁入 fcmd/dsl/actions/calc.py：
# now/parse/unix/fromunix/convert 五子命令均为纯 Python（datetime/
# zoneinfo 标准库），无子进程调用。now 子命令的 utc bool 开关演示
# type=bool 参数用法；非法时间格式/无效时区捕获后打印错误提示，不
# 视为失败（退出码 0）。

[commands.timetool.now]
help = "显示当前时间"
action = "timetool_now"

[commands.timetool.parse]
help = "解析时间字符串"
action = "timetool_parse"

[commands.timetool.unix]
help = "转 Unix 时间戳"
action = "timetool_unix"

[commands.timetool.fromunix]
help = "Unix 时间戳转时间"
action = "timetool_fromunix"

[commands.timetool.convert]
help = "时区转换"
action = "timetool_convert"
