wslmanw        = "fcmd.apps.wslman.wslmanw:main"
xmltool        = "fcmd.cli._entry:run_named"
yamtool        = "fcmd.cli._entry:run_named"
zipencrypt     = "fcmd.tools.archive.zipencrypt:main"

[project.optional-dependencies]
archive = [ "pyzipper>=0.3.6" ]
color = [ "coloraide>=2.9" ]
crypto = [ "cryptography>=43" ]
dev = [
    "fcmd[lint,test,full]",
    "prek>=0.4.5",
    "tox-uv>=1.13.1",
    "tox>=4.25.0"
]

filecheck = [ "puremagic>=1.28" ]
full = [ "fcmd[img,pdf,ocr,svg,crypto,archive,filecheck,color,pe,ppt,win32]" ]
img = [ "pillow>=10" ]
lint = [ "pyrefly>=1.1.1", "ruff>=0.8.0" ]
ocr = [ "fcmd[img]", "pytesseract>=0.3.13" ]
office = [ "fcmd[img,pdf,ocr,svg,ppt]" ]
# pymupdf 2.x 强依赖 onnxruntime / pymupdf-layout / pymupdf4llm；本项目只用基础 PDF 读写，锁 1.x
pdf = [ "pymupdf>=1.23,<2", "pypdf>=5.9.0" ]
pe = [ "pefile>=2024.8.26" ]
ppt = [ "python-pptx>=1.0" ]
svg = [ "resvg-py>=0.5" ]
test = [
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.1",
    "pytest>=8.0.0"
]
win32 = [ "pywin32>=306; sys_platform == 'win32'" ]

[build-system]
build-backend = "hatchling.build"
requires      = [ "hatchling" ]

[tool.hatch.build.targets.wheel]
packages = [ "src/fcmd" ]

[tool.fspack]
extras = [
    "archive",
    "color",
    "crypto",
    "filecheck",
    "img",
    "ocr",
    "office",
    "pdf",
    "pe",
    "win32"
]

[dependency-groups]
dev = [ "fcmd[lint,test,full]" ]
