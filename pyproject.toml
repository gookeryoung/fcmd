[project]
    authors=[{name="fcmd"}]
    classifiers=[
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Topic :: Software Development :: Libraries :: Application Frameworks",
    ]
    dependencies=["psutil>=6.0", "pyyaml>=6.0.1", "rich>=13.9"]
    description="Rapid Python tools collection"
    keywords=["cli", "dag", "scheduler", "task", "tools", "workflow"]
    license={text="MIT"}
    name="fcmd"
    readme="README.md"
    requires-python=">=3.13"
    version="0.3.10"

    [project.scripts]
        archivex      ="fcmd.tools.archive.archivex:main"
        asciitool     ="fcmd.dsl.entry:run_named"
        autofmt       ="fcmd.dsl.entry:run_named"
        bumpversion   ="fcmd.tools.dev.bumpversion:main"
        calcdate      ="fcmd.dsl.entry:run_named"
        casetool      ="fcmd.dsl.entry:run_named"
        clr           ="fcmd.dsl.entry:run_named"
        codetool      ="fcmd.dsl.entry:run_named"
        colortool     ="fcmd.dsl.entry:run_named"
        convtool      ="fcmd.dsl.entry:run_named"
        cryptool      ="fcmd.dsl.entry:run_named"
        csvtool       ="fcmd.dsl.entry:run_named"
        dockercmd     ="fcmd.dsl.entry:run_named"
        envdev        ="fcmd.tools.dev.envdev:main"
        fcmd          ="fcmd.cli.main:main"
        filecheck     ="fcmd.tools.media.filecheck:main"
        filedate      ="fcmd.dsl.entry:run_named"
        filelevel     ="fcmd.dsl.entry:run_named"
        filerename    ="fcmd.dsl.entry:run_named"
        filesearch    ="fcmd.dsl.entry:run_named"
        folderback    ="fcmd.dsl.entry:run_named"
        folderzip     ="fcmd.dsl.entry:run_named"
        gitt          ="fcmd.tools.dev.gittool:main"
        hashfile      ="fcmd.dsl.entry:run_named"
        hashtool      ="fcmd.dsl.entry:run_named"
        idtool        ="fcmd.dsl.entry:run_named"
        imaget        ="fcmd.dsl.entry:run_named"
        img2ico       ="fcmd.dsl.entry:run_named"
        inifile       ="fcmd.dsl.entry:run_named"
        iptool        ="fcmd.dsl.entry:run_named"
        jsont         ="fcmd.dsl.entry:run_named"
        llmbench      ="fcmd.tools.llm.llmbench:main"
        llmconvert    ="fcmd.tools.llm.llmconvert:main"
        llmdoctor     ="fcmd.tools.llm.llmdoctor:main"
        llmdown       ="fcmd.tools.llm.llmdown:main"
        llmengine     ="fcmd.tools.llm.llmengine:main"
        llmenv        ="fcmd.tools.llm.llmenv:main"
        llmmodel      ="fcmd.tools.llm.llmmodel:main"
        llmqnt        ="fcmd.tools.llm.llmqnt:main"
        llmqntw       ="fcmd.tools.llm.llmqntw:main"
        llmserve      ="fcmd.tools.llm.llmserve:main"
        llmservew     ="fcmd.tools.llm.llmservew:main"
        lscalc        ="fcmd.tools.calc.lscalc:main"
        mathtool      ="fcmd.dsl.entry:run_named"
        nettool       ="fcmd.dsl.entry:run_named"
        packtool      ="fcmd.tools.dev.packtool:main"
        padtool       ="fcmd.dsl.entry:run_named"
        pathtool      ="fcmd.dsl.entry:run_named"
        pdft          ="fcmd.dsl.entry:run_named"
        pipt          ="fcmd.dsl.entry:run_named"
        portcheck     ="fcmd.tools.net.portcheck:main"
        pymake        ="fcmd.tools.dev.pymake:main"
        randtool      ="fcmd.dsl.entry:run_named"
        regextool     ="fcmd.dsl.entry:run_named"
        reseticoncache="fcmd.dsl.entry:run_named"
        screenshot    ="fcmd.tools.media.screenshot:main"
        setenv        ="fcmd.dsl.entry:run_named"
        sshcopyid     ="fcmd.dsl.entry:run_named"
        stattool      ="fcmd.dsl.entry:run_named"
        sysinfo       ="fcmd.dsl.entry:run_named"
        taskk         ="fcmd.dsl.entry:run_named"
        textdiff      ="fcmd.dsl.entry:run_named"
        timetool      ="fcmd.dsl.entry:run_named"
        tomltool      ="fcmd.dsl.entry:run_named"
        txttool       ="fcmd.dsl.entry:run_named"
        urlcheck      ="fcmd.dsl.entry:run_named"
        urltool       ="fcmd.dsl.entry:run_named"
        wch           ="fcmd.dsl.entry:run_named"
        websave       ="fcmd.dsl.entry:run_named"
        writefile     ="fcmd.dsl.entry:run_named"
        xmltool       ="fcmd.dsl.entry:run_named"
        yamtool       ="fcmd.dsl.entry:run_named"
        zipencrypt    ="fcmd.tools.archive.zipencrypt:main"

    [project.optional-dependencies]
        archive=["pyzipper>=0.3.6"]
        color=["coloraide>=2.9"]
        crypto=["cryptography>=43"]
        dev=[
            "fcmd[lint,test,full]",
            "prek>=0.4.5",
            "tox-uv>=1.13.1",
            "tox>=4.25.0",
        ]
        filecheck=["puremagic>=1.28"]
        full=["fcmd[img,pdf,ocr,svg,crypto,archive,filecheck,color]"]
        img=["pillow>=10"]
        lint=["pyrefly>=1.1.1", "ruff>=0.8.0"]
        ocr=["fcmd[img]", "pytesseract>=0.3.13"]
        office=["fcmd[img,pdf,ocr,svg]"]
        pdf=["pymupdf>=1.23,<2", "pypdf>=5.9.0"]
        svg=["resvg-py>=0.5"]
        test=[
            "pytest-asyncio>=0.24.0",
            "pytest-cov>=5.0.0",
            "pytest-timeout>=2.3.1",
            "pytest-xdist>=3.6.1",
            "pytest>=8.0.0",
        ]

[build-system]
    build-backend="hatchling.build"
    requires     =["hatchling"]

[tool.hatch.build.targets.wheel]
    packages=["src/fcmd"]

[tool.fspack]
    extras=[
        "archive",
        "color",
        "crypto",
        "filecheck",
        "img",
        "ocr",
        "office",
        "pdf",
    ]

[dependency-groups]
    dev=["fcmd[lint,test,full]"]
