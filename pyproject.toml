regexvalidate  = "fcmd.tools.text.regexvalidate:main"
regexvalidatew = "fcmd.tools.text.regexvalidatew:main"
renamer        = "fcmd.apps.renamer.renamer:main"
renamerw       = "fcmd.apps.renamer.renamerw:main"
reseticoncache = "fcmd.cli._entry:run_named"
reshack        = "fcmd.apps.reshack.reshack:main"
reshackw       = "fcmd.apps.reshack.reshackw:main"
screenshot     = "fcmd.tools.media.screenshot:main"
