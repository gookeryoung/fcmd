[project]
name = "fcmd"
version = "0.3.0"
description = "极速 Python 工具集应用：DAG 任务调度 + 组合 CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "fcmd" }]
keywords = ["cli", "dag", "scheduler", "task", "workflow", "tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "typing-extensions>=4.13.2; python_version < '3.13'",
    "pyyaml>=6.0.1",
]

[project.scripts]
fcmd = "fcmd.cli.main:main"
archivex = "fcmd.cli.archive.archivex:main"
asciitool = "fcmd.cli.text.asciitool:main"
autofmt = "fcmd.cli.dev.autofmt:main"
bumpversion = "fcmd.cli.dev.bumpversion:main"
calcdate = "fcmd.cli.calc.calcdate:main"
casetool = "fcmd.cli.conv.casetool:main"
clr = "fcmd.cli.system.clr:main"
codetool = "fcmd.cli.conv.codetool:main"
colortool = "fcmd.cli.conv.colortool:main"
convtool = "fcmd.cli.conv.convtool:main"
csvtool = "fcmd.cli.data.csvtool:main"
cryptool = "fcmd.cli.crypto.cryptool:main"
dockercmd = "fcmd.cli.dev.dockercmd:main"
envdev = "fcmd.cli.dev.envdev:main"
filedate = "fcmd.cli.fileops.filedate:main"
filelevel = "fcmd.cli.fileops.filelevel:main"
filerename = "fcmd.cli.fileops.filerename:main"
filesearch = "fcmd.cli.fileops.filesearch:main"
folderback = "fcmd.cli.fileops.folderback:main"
folderzip = "fcmd.cli.archive.folderzip:main"
gitt = "fcmd.cli.dev.gittool:main"
hashfile = "fcmd.cli.crypto.hashfile:main"
hashtool = "fcmd.cli.crypto.hashtool:main"
idtool = "fcmd.cli.crypto.idtool:main"
inifile = "fcmd.cli.data.inifile:main"
imaget = "fcmd.cli.media.imagetool:main"
iptool = "fcmd.cli.net.iptool:main"
jsont = "fcmd.cli.data.jsontool:main"
lscalc = "fcmd.cli.calc.lscalc:main"
mathtool = "fcmd.cli.calc.mathtool:main"
nettool = "fcmd.cli.net.nettool:main"
packtool = "fcmd.cli.dev.packtool:main"
padtool = "fcmd.cli.text.padtool:main"
pathtool = "fcmd.cli.fileops.pathtool:main"
pdft = "fcmd.cli.media.pdftool:main"
pipt = "fcmd.cli.dev.piptool:main"
portcheck = "fcmd.cli.net.portcheck:main"
pymake = "fcmd.cli.dev.pymake:main"
randtool = "fcmd.cli.calc.randtool:main"
regextool = "fcmd.cli.text.regextool:main"
reseticoncache = "fcmd.cli.system.reseticoncache:main"
screenshot = "fcmd.cli.media.screenshot:main"
setenvt = "fcmd.cli.system.setenv:main"
stattool = "fcmd.cli.calc.stattool:main"
sshcopyid = "fcmd.cli.net.sshcopyid:main"
sysinfo = "fcmd.cli.system.sysinfo:main"
taskk = "fcmd.cli.system.taskkill:main"
textdiff = "fcmd.cli.text.textdiff:main"
timetool = "fcmd.cli.calc.timetool:main"
tomltool = "fcmd.cli.data.tomltool:main"
txttool = "fcmd.cli.text.txttool:main"
urltool = "fcmd.cli.conv.urltool:main"
wch = "fcmd.cli.system.which:main"
writefile = "fcmd.cli.fileops.writefile:main"
xmltool = "fcmd.cli.data.xmltool:main"
yamtool = "fcmd.cli.data.yamtool:main"
zipencrypt = "fcmd.cli.archive.zipencrypt:main"

[project.optional-dependencies]
img = ["pillow>=9.5.0,<10; python_version < '3.12'", "pillow>=10; python_version >= '3.12'"]
pdf = [
    "pymupdf>=1.22.0,<1.23; python_version < '3.12'", # PyMuPDF 1.23+ 的 mupdfcpp64.dll 链接了 Win7 UCRT 不支持的函数
    "pymupdf>=1.23; python_version >= '3.12'",
    "pypdf>=5.9.0",
]
ocr = ["pytesseract>=0.3.13", "fcmd[img]"]
office = ["fcmd[img,pdf,ocr]"]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.1",
]
dev = ["fcmd[lint,test,office]", "prek>=0.4.5", "tox>=4.25.0", "tox-uv>=1.13.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fcmd"]

[tool.hatch.build.targets.wheel.force-include]
"src/fcmd/py.typed" = "fcmd/py.typed"

# fspack 打包入口：fcmd 为 src layout，detect_entry 只扫顶层 *.py 无法识别，
# 需显式声明入口脚本（相对项目目录）。主入口 fcmd 统一路由所有子工具。
[tool.fspack.entries]
fcmd = "src/fcmd/cli/main.py"

[tool.fspack]
extras = ["img", "pdf", "ocr", "office"]

[dependency-groups]
dev = ["fcmd[lint,test,office]"]
