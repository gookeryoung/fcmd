[project]
authors = [ {name = "fcmd"} ]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks"
]
dependencies = [ "pillow>=10", "psutil>=6.0", "pyyaml>=6.0.1", "rich>=13.9" ]
description = "Rapid Python tools collection"
keywords = [ "cli", "dag", "scheduler", "task", "tools", "workflow" ]
license = {text = "MIT"}
name = "fcmd"
readme = "README.md"
requires-python = ">=3.13"
version = "0.3.12"

