preset           = "strict"
# mcp_adapter.py 与 test_mcp_adapter.py 依赖可选 mcp SDK，pyrefly.toml search-path 不覆盖 .venv；
# 运行时已通过 try/except 处理，这里整体排除避免误报
project-excludes = [".venv/**", "template/**", "assets/**", "src/fcmd/cli/mcp_adapter.py", "tests/cli/test_mcp_adapter.py"]
project-includes = ["**/*.ipynb", "**/*.py*"]
python-version   = "3.13"
search-path      = ["src", "."]
replace-imports-with-any = ["winreg"]

[errors]
# lambda 形参无法标注类型，严格模式下该规则会对全部测试 lambda 误报
implicit-any-lambda = false