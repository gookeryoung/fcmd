preset           = "strict"
# mcp_adapter.py 与 test_mcp_adapter.py 依赖可选 mcp SDK，pyrefly.toml search-path 不覆盖 .venv；
# 运行时已通过 try/except 处理，这里整体排除避免误报
project-excludes = [".venv/**", "template/**", "assets/**", "src/fcmd/cli/mcp_adapter.py", "tests/cli/test_mcp_adapter.py", "src/fcmd/gui/qt/**", "src/fcmd/apps/llm/_llmw_qt_*.py", "src/fcmd/*/*/_*w_qt.py", "src/fcmd/*/*/_*_qt.py", "src/fcmd/apps/cmder/_cmder_qt*.py"]
project-includes = ["**/*.ipynb", "**/*.py*"]
python-version   = "3.10"
search-path      = ["src", "."]
# PySide6 仅在 Python ≥3.11 安装，3.10（本地/CI 类型检查所用版本）只有 PySide2；
# 业务代码与测试统一写 PySide6（运行时由 gui.qt._pyside_compat 映射），
# 类型检查无法解析时按 Any 处理，Qt 源码模块已在上方整体排除。
replace-imports-with-any = ["winreg", "PySide6.*"]

[errors]
# lambda 形参无法标注类型，严格模式下该规则会对全部测试 lambda 误报
implicit-any-lambda = false